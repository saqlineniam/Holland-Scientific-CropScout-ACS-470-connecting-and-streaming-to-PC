<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" rx="12" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#1a1a1a">ACS-470 → PC wiring (RS-485, two-way)</text>
  <text x="24" y="60" font-size="13" fill="#555">M12 4-pin A-coded pigtail (Turck Eurofast colours) · adapter switch set to RS485 · 76800 baud 8N1</text>

  <!-- Sensor -->
  <rect x="24" y="130" width="166" height="150" rx="10" fill="#eef3f8" stroke="#3b5b7a" stroke-width="2"/>
  <text x="107" y="165" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Crop Circle</text>
  <text x="107" y="186" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">ACS-470</text>
  <text x="107" y="212" font-size="12" fill="#555" text-anchor="middle">active canopy sensor</text>
  <text x="107" y="262" font-size="12" fill="#555" text-anchor="middle">M12 4-pin connector</text>

  <!-- Wires (drawn under labels) -->
  <!-- blue: sensor -> TX -->
  <path d="M190,170 H440 V185 H600" fill="none" stroke="#1f5fbf" stroke-width="5"/>
  <!-- brown: sensor -> RX -->
  <path d="M190,200 H460 V215 H600" fill="none" stroke="#8b4513" stroke-width="5"/>
  <!-- black: sensor -> GND, branch to battery - -->
  <path d="M190,230 H480 V245 H600" fill="none" stroke="#111" stroke-width="5"/>
  <path d="M480,238 V350" fill="none" stroke="#111" stroke-width="5"/>
  <circle cx="480" cy="238" r="6" fill="#111"/>
  <!-- white: sensor -> battery + -->
  <path d="M190,260 H340 V350" fill="none" stroke="#666" stroke-width="7"/>
  <path d="M190,260 H340 V350" fill="none" stroke="#f4f4f4" stroke-width="4"/>

  <!-- Wire labels -->
  <text x="200" y="163" font-size="12" fill="#1f5fbf" font-weight="600">blue — RS-485 data (inverted)</text>
  <text x="200" y="193" font-size="12" fill="#8b4513" font-weight="600">brown — RS-485 data</text>
  <text x="200" y="223" font-size="12" fill="#111" font-weight="600">black — ground</text>
  <text x="200" y="253" font-size="12" fill="#555" font-weight="600">white — +12 V power</text>

  <!-- Battery -->
  <rect x="290" y="350" width="240" height="70" rx="10" fill="#fff6e8" stroke="#a86b00" stroke-width="2"/>
  <text x="410" y="382" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">12 V battery / supply</text>
  <text x="340" y="406" font-size="13" fill="#a86b00" font-weight="700" text-anchor="middle">+</text>
  <text x="480" y="406" font-size="13" fill="#a86b00" font-weight="700" text-anchor="middle">−</text>

  <!-- Adapter -->
  <rect x="600" y="120" width="190" height="180" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="695" y="146" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">USB serial adapter</text>
  <text x="695" y="164" font-size="12" fill="#555" text-anchor="middle">FTDI FT232R · RS232/RS485</text>
  <circle cx="612" cy="185" r="5" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="612" cy="215" r="5" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="612" cy="245" r="5" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="624" y="190" font-size="13" font-weight="700" fill="#1a1a1a">TX</text>
  <text x="624" y="220" font-size="13" font-weight="700" fill="#1a1a1a">RX</text>
  <text x="624" y="250" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <rect x="680" y="268" width="96" height="22" rx="4" fill="#2e7d32"/>
  <text x="728" y="284" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">switch: RS485</text>

  <!-- USB -->
  <path d="M790,215 H830" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="8 5"/>
  <text x="810" y="205" font-size="11" fill="#555" text-anchor="middle">USB</text>

  <!-- PC -->
  <rect x="830" y="160" width="110" height="110" rx="10" fill="#f2f2f2" stroke="#444" stroke-width="2"/>
  <text x="885" y="200" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">PC</text>
  <text x="885" y="222" font-size="12" fill="#555" text-anchor="middle">COMx</text>
  <text x="885" y="240" font-size="12" fill="#555" text-anchor="middle">76800 8N1</text>

  <!-- Notes -->
  <text x="600" y="340" font-size="12" fill="#333">• If data looks garbled, swap blue ↔ brown.</text>
  <text x="600" y="360" font-size="12" fill="#333">• Never connect +12 V (white) to the adapter.</text>
  <text x="600" y="380" font-size="12" fill="#333">• Receive-only alternative: see README.</text>
  <text x="600" y="400" font-size="12" fill="#333">• Data lines idle at ~3 V; logic is 3.3 V.</text>
</svg>
